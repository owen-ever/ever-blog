# Synology Container Manager 프로젝트용입니다. NAS 레지스트리 이미지를 받아 실행합니다(빌드 없음).
# 상대 경로는 프로젝트 폴더 기준입니다. 값 변경은 .env.example과 README의 '배포' 절을 참고합니다.
services:
  ever-blog:
    image: ${EVER_BLOG_IMAGE:-docker.owen.kr/ever-blog}:${EVER_BLOG_TAG:-0.3.0}
    container_name: ever-blog
    ports:
      - '${EVER_BLOG_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTS_DIR=/posts
    restart: unless-stopped
    volumes:
      - ${EVER_BLOG_POSTS_DIR:-./posts}:/posts
      - ${EVER_BLOG_IMAGES_DIR:-./images}:/posts/images
